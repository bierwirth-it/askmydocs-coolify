# Baut das AskMyDocs-Image und veröffentlicht es in der GitHub Container Registry
# (ghcr.io/<owner>/askmydocs). Das Coolify-Template (coolify-template.yml) nutzt
# dieses Image, damit in Coolify kein Build mehr nötig ist.
name: AskMyDocs-Image bauen

on:
  push:
    branches: [main]
    paths: [Dockerfile, .github/workflows/build-image.yml]
  schedule:
    # Wöchentlich neu bauen, damit Upstream-Änderungen (ASKMYDOCS_REF=main) ankommen
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: "AskMyDocs-Branch, -Tag oder -Commit"
        default: main
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image-Namen ableiten
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          ref="${{ github.event.inputs.ref || 'main' }}"
          tag="$(echo "$ref" | tr '/' '-')"
          echo "image=ghcr.io/${owner}/askmydocs" >> "$GITHUB_OUTPUT"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            ASKMYDOCS_REF=${{ steps.meta.outputs.ref }}
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Der Quellcode-Clone darf nicht aus dem Cache kommen
          no-cache-filters: source
